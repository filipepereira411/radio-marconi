<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marconi – Emissora</title>
<style>
:root{
  --room:#d9cdb8; --ink:#2a1a0e; --wood1:#7a4421; --wood2:#4b2610; --wood3:#2c1608;
  --cloth:#c9b58a; --cloth-line:#8d7648; --brass:#d3a64a; --brass-d:#8a6420; --glass:#e9dfbf; --needle:#b3261e;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--room:#16100b;--ink:#f0e2c6}}
:root[data-theme="dark"]{--room:#16100b;--ink:#f0e2c6}
html,body{margin:0;min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--room);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;justify-content:center;padding:20px 14px 40px}
.wrap{width:100%;max-width:520px}
.cab{
  background:linear-gradient(100deg,var(--wood2),var(--wood1) 18%,var(--wood2) 40%,var(--wood1) 62%,var(--wood3));
  border-radius:46% 46% 14px 14px / 22% 22% 14px 14px;
  padding:34px 26px 26px;box-shadow:inset 0 0 0 3px #00000040,inset 0 0 40px #0008,0 18px 30px #0006;
  position:relative;
}
.plate{text-align:center;font-style:italic;letter-spacing:.35em;color:var(--brass);font-size:1.15rem;text-shadow:0 1px 0 #000a;margin:0 0 14px}
.window{
  position:relative;border-radius:50% 50% 10px 10px / 30% 30% 10px 10px;overflow:hidden;
  background:#111;aspect-ratio:4/3;border:7px solid var(--brass);box-shadow:inset 0 0 22px #000,0 0 0 3px var(--brass-d),0 2px 6px #000a;
}
video,#msg{position:absolute;inset:0;width:100%;height:100%}
video{object-fit:cover;transition:filter .35s}
#msg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;color:#e9dfbf;font-size:.95rem}
#msg button{font:inherit}
.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#000a 100%);}
.noise{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:overlay;transition:opacity .3s;
  background-image:repeating-linear-gradient(0deg,#0000 0 2px,#0004 2px 3px)}
.noise.on{opacity:1}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
.dial{margin:14px 6px 0;background:var(--glass);border-radius:8px;border:3px solid var(--brass-d);height:46px;position:relative;box-shadow:inset 0 0 10px #0005}
.dial ol{list-style:none;margin:0;padding:0 4%;display:flex;justify-content:space-between;align-items:center;height:100%;font-size:.78rem;color:#3a2a14}
.dial li{width:0;display:flex;justify-content:center;white-space:nowrap}
.needle{position:absolute;top:3px;bottom:3px;width:2px;background:var(--needle);left:0;transition:left .35s cubic-bezier(.3,1.4,.5,1);box-shadow:0 0 4px #b3261e88}
.cloth{
  margin:16px 6px 0;height:92px;border-radius:8px;border:3px solid var(--brass-d);
  background:repeating-linear-gradient(90deg,var(--cloth) 0 6px,var(--cloth-line) 6px 7px),var(--cloth);
  box-shadow:inset 0 0 18px #0007;display:flex;align-items:center;justify-content:center;
}
.log{width:86%;height:70px;overflow:auto;background:#2a1a0ee6;color:#f0e2c6;border-radius:4px;padding:6px 10px;font-size:.82rem;line-height:1.35;box-shadow:0 1px 3px #000a}
.log p{margin:0 0 4px}.log b{color:var(--brass);font-weight:normal;font-style:italic}
.say{display:flex;gap:8px;margin:10px 6px 0}
.say input{flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:6px;border:2px solid var(--brass-d);background:var(--glass);color:#2a1a0e}
.say button,.pick button{font:inherit;padding:8px 14px;border-radius:6px;border:2px solid var(--brass-d);background:var(--brass);color:#2a1a0e;cursor:pointer}
.pick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pick input{font:inherit;width:9em;padding:7px 9px;border-radius:6px;border:2px solid var(--brass-d);background:var(--glass);color:#2a1a0e;text-align:center}
.say input:focus-visible,.pick input:focus-visible,.say button:focus-visible,.pick button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.knob.sm{width:56px;height:56px}
.led{position:absolute;top:10px;right:14px;width:10px;height:10px;border-radius:50%;background:#400;box-shadow:0 0 0 2px #0008}
.led.on{background:#f33;box-shadow:0 0 8px #f33,0 0 0 2px #0008}
.status{font-size:.8rem;opacity:.9;min-height:1.2em}
.knobs{display:flex;justify-content:space-around;align-items:flex-end;margin-top:20px}
.knob-box{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--brass);font-size:.8rem}
.knob{
  width:64px;height:64px;border-radius:50%;border:0;cursor:grab;touch-action:none;position:relative;
  background:radial-gradient(circle at 35% 30%,#4a3a2a,#120a04 70%);box-shadow:0 0 0 3px var(--brass-d),0 4px 8px #000a,inset 0 2px 3px #fff3;
}
.knob::after{content:"";position:absolute;top:6px;left:50%;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:var(--brass)}
.knob.big{width:78px;height:78px;cursor:pointer;background:radial-gradient(circle at 35% 30%,#d94a3a,#6a0f08 75%)}
.knob.big::after{display:none}
.knob.big:active{transform:scale(.94)}
.knob:focus-visible,#msg button:focus-visible,.shot a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.roll{margin-top:22px}
.roll h2{font-size:1rem;font-weight:normal;font-style:italic;margin:0 0 8px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;min-height:84px}
.strip p{margin:0;opacity:.7;font-size:.9rem;align-self:center}
.shot{flex:0 0 auto;background:#f4efe2;padding:6px 6px 14px;box-shadow:0 2px 6px #0006;transform:rotate(-1.5deg)}
.shot:nth-child(even){transform:rotate(1.5deg)}
.shot img{display:block;height:92px;width:auto}
.shot a{display:block;text-align:center;font-size:.72rem;color:#3a2a14;margin-top:4px}
@media (prefers-reduced-motion:reduce){.needle,video{transition:none}.flash.go{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="cab">
    <p class="plate">MARCONI</p>
    <div class="window">
      <video id="v" autoplay playsinline muted></video>
      <div class="noise" id="noise"></div>
      <div class="glow"></div><div class="led" id="led" title="Em emissão"></div>
      <div class="flash" id="flash"></div>
      <div id="msg">
        <div id="msgtxt">Escolha um canal e ligue a emissão.</div>
        <div class="pick">
          <input id="chan" value="canal1" maxlength="20" aria-label="Nome do canal">
          <button id="tx">Emitir (câmara)</button>
        </div>
        <div class="status" id="status" role="status"></div>
      </div>
    </div>
    <div class="dial" aria-hidden="true">
      <ol id="stations"></ol>
      <div class="needle" id="needle"></div>
    </div>
    <div class="cloth"><div class="log" id="log" aria-live="polite"><p><b>Marconi</b> Sem emissões.</p></div></div>
    <div class="say"><input id="txt" maxlength="300" placeholder="Mensagem para o outro lado" aria-label="Mensagem"><button id="send">Enviar</button></div>
    <div class="knobs">
      <div class="knob-box">
        <button class="knob sm" id="tune" role="slider" aria-label="Sintonizar filtro" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0" aria-valuetext="Lisboa"></button>
        Sintonia
      </div>
      <div class="knob-box">
        <button class="knob big" id="shutter" aria-label="Tirar fotografia"></button>
        Disparo
      </div>
      <div class="knob-box">
        <button class="knob sm" id="flip" aria-label="Trocar de câmara"></button>
        Frente/trás
      </div>
      <div class="knob-box">
        <button class="knob sm" id="ai" aria-label="Pedir ao locutor com IA que descreva a imagem"></button>
        Locutor IA
      </div>
    </div>
  </div>
  <section class="roll">
    <h2>Fotografias captadas</h2>
    <div class="strip" id="strip"><p>Ainda sem emissões. Carregue no botão vermelho.</p></div>
  </section>
</main>
<script>
(function(){
  var stations=[
    {n:"Lisboa",f:"none",noise:false},
    {n:"Londres",f:"sepia(1) contrast(1.1) brightness(.95)",noise:false},
    {n:"Paris",f:"grayscale(1) contrast(1.3) brightness(1.05)",noise:false},
    {n:"Roma",f:"saturate(1.9) contrast(1.1) hue-rotate(-12deg)",noise:false},
    {n:"Berlim",f:"grayscale(1) contrast(1.6) brightness(.9)",noise:true}
  ];
  var $=function(i){return document.getElementById(i)};
  var v=$("v"),msg=$("msg"),tune=$("tune"),needle=$("needle"),noise=$("noise"),flash=$("flash"),strip=$("strip"),
      ol=$("stations"),dial=document.querySelector(".dial"),logEl=$("log"),status=$("status"),led=$("led");
  var idx=0,facing="user",stream=null,count=0,role=null,R=null,sample=null,roomMod=null,pcs={},queued={},helloT=null,iceBuf={};
  var ICE=[{urls:"stun:stun.l.google.com:19302"}];

  stations.forEach(function(s){var li=document.createElement("li");li.textContent=s.n;ol.appendChild(li)});

  function setStation(i){
    idx=Math.max(0,Math.min(stations.length-1,i));
    var s=stations[idx];v.style.filter=s.f;noise.classList.toggle("on",s.noise);
    var li=ol.children[idx],dr=dial.getBoundingClientRect(),lr=li.getBoundingClientRect();
    needle.style.left=(lr.left-dr.left+lr.width/2-3)+"px";
    tune.style.transform="rotate("+(-120+idx*60)+"deg)";
    tune.setAttribute("aria-valuenow",idx);tune.setAttribute("aria-valuetext",s.n);
  }
  var startX=null,startIdx=0;
  tune.addEventListener("pointerdown",function(e){startX=e.clientX;startIdx=idx;tune.setPointerCapture(e.pointerId)});
  tune.addEventListener("pointermove",function(e){if(startX!==null)setStation(startIdx+Math.round((e.clientX-startX)/40))});
  tune.addEventListener("pointerup",function(e){if(startX!==null&&Math.abs(e.clientX-startX)<6)setStation((idx+1)%stations.length);startX=null});
  tune.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight"||e.key==="ArrowUp"){setStation(idx+1);e.preventDefault()}
    if(e.key==="ArrowLeft"||e.key==="ArrowDown"){setStation(idx-1);e.preventDefault()}
  });
  window.addEventListener("resize",function(){setStation(idx)});

  function log(who,text){
    var p=document.createElement("p"),b=document.createElement("b");
    b.textContent=who+" ";p.appendChild(b);p.appendChild(document.createTextNode(String(text).slice(0,1500)));
    logEl.appendChild(p);logEl.scrollTop=logEl.scrollHeight;
  }
  function setStatus(t){status.textContent=t}

  /* Ligação à sala (sinalização) e IA: aparecem se a página estiver aberta no claude.ai */
  (function init(){
    var C=window.claude;if(!C||!C.use)return;
    C.use("room").then(function(r){roomMod=r}).catch(function(){});
    C.use("sample").then(function(s){sample=s}).catch(function(){});
  })();

  function z(s){
    var cs=new Blob([s]).stream().pipeThrough(new CompressionStream("gzip"));
    return new Response(cs).arrayBuffer().then(function(b){var a=new Uint8Array(b),t="";a.forEach(function(x){t+=String.fromCharCode(x)});return btoa(t)});
  }
  function u(b){
    var bin=atob(b),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
    return new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  }
  function me(){var p=R&&R.peers().find(function(p){return p.sameTab});return p&&p.peer}
  function send(o){return R?R.emit("rtc",o).catch(function(){}):Promise.resolve()}

  function addIce(peer,c){
    var pc=pcs[peer];
    if(pc&&pc.remoteDescription)pc.addIceCandidate(c).catch(function(){});
    else(iceBuf[peer]=iceBuf[peer]||[]).push(c);
  }
  function flushIce(peer){(iceBuf[peer]||[]).forEach(function(c){pcs[peer].addIceCandidate(c).catch(function(){})});iceBuf[peer]=[]}

  function newPc(peer){
    if(pcs[peer])pcs[peer].close();
    var pc=new RTCPeerConnection({iceServers:ICE});pcs[peer]=pc;
    pc.onicecandidate=function(e){if(e.candidate)send({t:"ice",to:peer,c:e.candidate.toJSON()})};
    pc.onconnectionstatechange=function(){
      if(pc.connectionState==="connected")log("Marconi",role==="tx"?"Alguém sintonizou a emissão.":"Sinal recebido.");
      if(pc.connectionState==="failed")log("Marconi","A ligação falhou. Tente outra vez ou outra rede.");
    };
    return pc;
  }

  function offerTo(peer){
    if(!stream)return;
    var pc=newPc(peer);
    stream.getTracks().forEach(function(t){pc.addTrack(t,stream)});
    pc.createOffer().then(function(o){return pc.setLocalDescription(o)})
      .then(function(){return z(JSON.stringify(pc.localDescription))})
      .then(function(s){return send({t:"offer",to:peer,s:s})}).catch(function(){});
  }

  function onSignal(m){
    if(m.isMe)return;
    var d=m.data||{};
    if(d.to&&d.to!==me())return;
    if(d.t==="hello"&&role==="tx")offerTo(m.peer);
    else if(d.t==="offer"&&role==="rx"){
      var pc=newPc(m.peer);
      pc.ontrack=function(e){
        v.srcObject=e.streams[0];msg.style.display="none";clearInterval(helloT);led.classList.add("on");
      };
      u(d.s).then(function(j){return pc.setRemoteDescription(JSON.parse(j))})
        .then(function(){flushIce(m.peer);return pc.createAnswer()})
        .then(function(a){return pc.setLocalDescription(a)})
        .then(function(){return z(JSON.stringify(pc.localDescription))})
        .then(function(s){return send({t:"answer",to:m.peer,s:s})}).catch(function(){setStatus("Sinal ilegível.")});
    }
    else if(d.t==="answer"&&role==="tx"&&pcs[m.peer]){
      u(d.s).then(function(j){return pcs[m.peer].setRemoteDescription(JSON.parse(j))}).then(function(){flushIce(m.peer)}).catch(function(){});
    }
    else if(d.t==="ice"&&d.c)addIce(m.peer,d.c);
    else if(d.t==="chat"&&typeof d.x==="string")log(String(d.w||"Outro lado").slice(0,30),d.x);
  }

  /* Canal de recurso: BroadcastChannel (separadores do mesmo navegador).
     Para usar entre dispositivos diferentes, substitua por um WebSocket com a mesma interface
     (emit, on, peers). */
  function localRoom(code){
    var id=Math.random().toString(36).slice(2),bc=new BroadcastChannel(code),hs=[];
    bc.onmessage=function(e){if(e.data.peer===id)return;hs.forEach(function(h){h({isMe:false,peer:e.data.peer,data:e.data.data})})};
    return {local:true,emit:function(t,d){bc.postMessage({peer:id,data:d});return Promise.resolve()},
            on:function(t,h){hs.push(h)},peers:function(){return [{sameTab:true,peer:id}]}};
  }

  function join(){
    var code="m-"+($("chan").value||"canal1").toLowerCase().replace(/[^a-z0-9_.-]/g,"-").slice(0,40);
    if(!roomMod){R=localRoom(code);R.on("rtc",onSignal);return Promise.resolve(R)}
    return roomMod.join(code).then(function(r){R=r;r.on("rtc",onSignal,function(){});return r}).catch(function(){return null});
  }

  function getCam(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return Promise.reject();
    return navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false}).then(function(s){
      var old=stream;stream=s;v.srcObject=s;
      if(old)old.getTracks().forEach(function(t){t.stop()});
      var nt=s.getVideoTracks()[0];
      Object.keys(pcs).forEach(function(k){pcs[k].getSenders().forEach(function(sn){if(sn.track&&sn.track.kind==="video")sn.replaceTrack(nt)})});
    });
  }

  $("tx").addEventListener("click",function(){
    role="tx";setStatus("A pedir acesso à câmara…");
    getCam().then(function(){
      msg.style.display="none";
      return join();
    }).then(function(r){
      if(r){led.classList.add("on");log("Marconi","Em emissão no canal "+$("chan").value+(r.local?" (só neste navegador: abra radio.html noutro separador).":". Abra radio.html e escolha o mesmo canal."))}
      else log("Marconi","Só câmara local.");
    }).catch(function(){
      role=null;setStatus("Câmara não autorizada ou indisponível. Se a página estiver embebida, abra-a num separador.");
    });
  });
  $("flip").addEventListener("click",function(){
    if(role!=="tx"||!stream)return;
    facing=facing==="user"?"environment":"user";getCam().catch(function(){});
  });

  function frameBlob(cb,filtered){
    if(!v.videoWidth){log("Marconi","Ainda não há imagem.");return}
    var c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;
    var x=c.getContext("2d");
    if(filtered){try{x.filter=stations[idx].f}catch(e){}}
    x.drawImage(v,0,0);cb(c);
  }
  $("shutter").addEventListener("click",function(){
    frameBlob(function(c){
      var url=c.toDataURL("image/jpeg",.9);
      flash.classList.remove("go");void flash.offsetWidth;flash.classList.add("go");
      if(count===0)strip.innerHTML="";count++;
      var d=document.createElement("div");d.className="shot";
      var im=new Image();im.src=url;im.alt="Fotografia "+count+", sintonia "+stations[idx].n;
      var a=document.createElement("a");a.href=url;a.download="marconi-"+count+".jpg";a.textContent="Guardar";
      d.appendChild(im);d.appendChild(a);strip.insertBefore(d,strip.firstChild);
    },true);
  });

  /* Locutor IA */
  var busy=false;
  $("ai").addEventListener("click",function(){
    if(!sample){log("Marconi","O locutor IA só está disponível com a página aberta no claude.ai.");return}
    if(busy)return;
    frameBlob(function(c){
      busy=true;log("Locutor IA","A afinar a voz…");
      c.toBlob(function(b){
        sample("És o locutor de uma rádio portuguesa de 1936. Descreve em português de Portugal, em duas frases curtas e com tom de locutor de época, o que se vê nesta imagem de uma câmara em direto. Não inventes o que não se vê.",
          {images:b,modelTier:"quick",cache:false})
        .then(function(r){
          var t=r.text.trim();log("Locutor IA",t);send({t:"chat",w:"Locutor IA",x:t.slice(0,1500)});
          try{var ut=new SpeechSynthesisUtterance(t);ut.lang="pt-PT";speechSynthesis.cancel();speechSynthesis.speak(ut)}catch(e){}
        }).catch(function(e){
          log("Marconi",e&&e.code==="not_granted"?"A IA não foi autorizada.":"O locutor está sem sinal. Tente mais tarde.");
        }).then(function(){busy=false});
      },"image/jpeg",.85);
    },false);
  });

  function say(){
    var t=$("txt").value.trim().slice(0,300);if(!t)return;
    $("txt").value="";log("Eu",t);send({t:"chat",w:role==="rx"?"Ajudante":"Emissor",x:t});
  }
  $("send").addEventListener("click",say);
  $("txt").addEventListener("keydown",function(e){if(e.key==="Enter")say()});

  setStation(0);
})();
</script>
</body>
</html>
